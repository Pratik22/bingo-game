<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Game</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

#bingo {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.letter {
    width: 50px;
    height: 50px;
    border: 2px solid #333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    background: white;
    cursor: pointer;
    user-select: none;
}

.letter.crossed {
    background: #ff4d4d;
    color: white;
    text-decoration: line-through;
}

#board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 420px;
    margin: 20px auto;
}

.cell {
    aspect-ratio: 1;
    background: white;
    border: 2px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    border-radius: 8px;
}

.cell.marked {
    background: #4CAF50;
    color: white;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

@media (max-width: 500px) {
    .cell {
        font-size: 20px;
    }

    .letter {
        width: 45px;
        height: 45px;
        font-size: 20px;
    }
}
</style>
</head>
<body>

<h1>🎉 BINGO 🎉</h1>

<div id="bingo">
    <div class="letter">B</div>
    <div class="letter">I</div>
    <div class="letter">N</div>
    <div class="letter">G</div>
    <div class="letter">O</div>
</div>

<button onclick="newGame()">🔀 New Board</button>

<div id="board"></div>

<script>
const board = document.getElementById('board');

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function createBoard() {
    board.innerHTML = '';

    let numbers = [];
    for (let i = 1; i <= 25; i++) {
        numbers.push(i);
    }

    shuffle(numbers);

    numbers.forEach(num => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = num;

        cell.addEventListener('click', () => {
            cell.classList.toggle('marked');
        });

        board.appendChild(cell);
    });
}

document.querySelectorAll('.letter').forEach(letter => {
    letter.addEventListener('click', () => {
        letter.classList.toggle('crossed');

        const completed =
            document.querySelectorAll('.letter.crossed').length;

        if (completed === 5) {
            setTimeout(() => {
                alert('🎉 BINGO! 🎉');
            }, 100);
        }
    });
});

function newGame() {
    createBoard();

    document.querySelectorAll('.letter').forEach(letter => {
        letter.classList.remove('crossed');
    });
}

createBoard();
</script>

</body>
</html>
