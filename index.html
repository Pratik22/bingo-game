<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Game</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1 {
    margin-bottom: 10px;
}

#bingo {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.letter {
    width: 50px;
    height: 50px;
    border: 2px solid #333;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    background: white;
    transition: 0.3s;
}

.letter.crossed {
    background: #ff4d4d;
    color: white;
    text-decoration: line-through;
}

#board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 450px;
    margin: 20px auto;
}

.cell {
    aspect-ratio: 1;
    background: white;
    border: 2px solid #333;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: 0.2s;
}

.cell.marked {
    background: #4CAF50;
    color: white;
}

button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

@media (max-width: 500px) {
    .cell {
        font-size: 20px;
    }

    .letter {
        width: 42px;
        height: 42px;
        font-size: 20px;
    }
}
</style>
</head>
<body>

<h1>🎉 BINGO 🎉</h1>

<div id="bingo">
    <div class="letter">B</div>
    <div class="letter">I</div>
    <div class="letter">N</div>
    <div class="letter">G</div>
    <div class="letter">O</div>
</div>

<button onclick="newGame()">🔀 New Board</button>

<div id="board"></div>

<script>
const board = document.getElementById('board');

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function createBoard() {
    board.innerHTML = '';

    let numbers = [];
    for (let i = 1; i <= 25; i++) {
        numbers.push(i);
    }

    shuffle(numbers);

    numbers.forEach(num => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = num;

        cell.addEventListener('click', () => {
            cell.classList.toggle('marked');
            updateBingo();
        });

        board.appendChild(cell);
    });

    updateBingo();
}

function countCompletedLines() {
    const cells = [...document.querySelectorAll('.cell')];
    let count = 0;

    // Rows
    for (let r = 0; r < 5; r++) {
        let complete = true;
        for (let c = 0; c < 5; c++) {
            if (!cells[r * 5 + c].classList.contains('marked')) {
                complete = false;
                break;
            }
        }
        if (complete) count++;
    }

    // Columns
    for (let c = 0; c < 5; c++) {
        let complete = true;
        for (let r = 0; r < 5; r++) {
            if (!cells[r * 5 + c].classList.contains('marked')) {
                complete = false;
                break;
            }
        }
        if (complete) count++;
    }

    // Main diagonal
    let diag1 = true;
    for (let i = 0; i < 5; i++) {
        if (!cells[i * 6].classList.contains('marked')) {
            diag1 = false;
            break;
        }
    }
    if (diag1) count++;

    // Anti diagonal
    let diag2 = true;
    for (let i = 0; i < 5; i++) {
        if (!cells[(i + 1) * 4].classList.contains('marked')) {
            diag2 = false;
            break;
        }
    }
    if (diag2) count++;

    return Math.min(count, 5);
}

function updateBingo() {
    const completedLines = countCompletedLines();
    const letters = document.querySelectorAll('.letter');

    letters.forEach((letter, index) => {
        if (index < completedLines) {
            letter.classList.add('crossed');
        } else {
            letter.classList.remove('crossed');
        }
    });

    if (completedLines === 5) {
        setTimeout(() => {
            alert('🎉 BINGO! You Win!');
        }, 100);
    }
}

function newGame() {
    createBoard();
}

createBoard();
</script>

</body>
</html>
